{% extends "base.html" %}

{% block title %}Удаление пользователя · Начисление{% endblock %}

{% block content %}
  <section class="panel">
    <h1>Удалить пользователя?</h1>
    <p>Пользователь: <strong>{{ edited_user.username }}</strong></p>
    <p class="status-warn">Это действие нельзя отменить.</p>

    <form method="post">
      {% csrf_token %}
      <button class="button" type="submit">Удалить</button>
      <a class="button secondary" href="{% url 'app_user_list' %}">Отмена</a>
    </form>
  </section>
{% endblock %}
