{% extends "base.html" %}

{% block title %}Пароль · Пользователи{% endblock %}

{% block content %}
  <section class="panel">
    <h1>Смена пароля: {{ edited_user.username }}</h1>

    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <div>
        <button class="button" type="submit">Сменить пароль</button>
        <a class="button secondary" href="{% url 'app_user_list' %}">Назад</a>
      </div>
    </form>
  </section>
{% endblock %}
