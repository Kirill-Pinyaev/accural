{% extends "base.html" %}

{% block title %}{{ title }} · Начисление{% endblock %}

{% block content %}
  <section class="panel">
    <h1>{{ title }}</h1>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <div>
        <button class="button" type="submit">Сохранить</button>
        <a class="button secondary" href="{% url 'employee_list' %}">Отмена</a>
      </div>
    </form>
  </section>
{% endblock %}
